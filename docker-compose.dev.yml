services:
  postgres:
    image: postgres:16-alpine
    container_name: coffein-postgres
    environment:
      POSTGRES_USER: coffein
      POSTGRES_PASSWORD: coffein
      POSTGRES_DB: coffein
    ports:
      - "5433:5432"
    volumes:
      - coffein_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffein -d coffein"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coffein_pgdata:
